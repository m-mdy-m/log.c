name: Bug report
description: Report a reproducible defect in m-mdy-m-log.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check the current README and existing issues. Never include secrets or production log payloads.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or commit SHA.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and version
      placeholder: GCC 14 / Clang 19 / MSVC 2022
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Minimal code and exact build/run commands.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already performed
      description: Include `make check` or CTest results when possible.
